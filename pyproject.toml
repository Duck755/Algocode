[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "algocode"
version = "0.1.0.dev0"
description = "A reproducible algorithm optimization agent for C++ and Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
docs = ["markitdown"]

[project.scripts]
algocode = "algocode.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/algocode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["demo", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
