site_name: Algocode Docs
site_description: Algocode 可验证算法优化 Agent 的用户与开发文档
site_url: "https://algocode.chat/docs/"
repo_url: https://github.com/acfoundry/Algocode
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  favicon: picture/algocode_icon.png
  logo: picture/algocode_icon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速上手:
      - 安装: getting-started/installation.md
      - 快速开始: getting-started/quickstart.md
