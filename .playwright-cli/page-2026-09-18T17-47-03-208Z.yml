        - generic [ref=e530]: 性能与结果声明
        - paragraph [ref=e534]: Algocode 通过大模型分析源代码并生成候选优化。优化后的性能可能提升、没有明显变化，甚至下降； 结果受源代码质量、项目结构、模型能力、输入规模、运行环境和系统负载等因素影响。Algocode 不承诺每次优化都带来正收益，也不替代人工代码审查。请以实际的 Correctness、Contract、 Benchmark、Diff 和 Review 结果为准，在确认行为正确且收益满足预期后再 Apply。
