      - generic "Algocode 命令行示例" [ref=e29]:
        - generic [ref=e30]: algocode
        - code [ref=e37]: "$ algocode init # 分析项目并生成行为契约、Oracle 与 Benchmark $ algocode optimize # 在隔离 Worktree 中生成候选，完成验证与基准对比 $ algocode report # 生成报告与 Diff，等待你决定是否 Apply"
    - generic [ref=e39]:
      - generic [ref=e40]:
        - paragraph [ref=e41]: 不是黑盒优化器
        - heading "先证明，再应用" [level=2] [ref=e42]
        - paragraph [ref=e43]: Algocode 将模型判断放在真实证据之后。优化速度不是唯一目标，正确性和契约保护排在前面。
      - generic [ref=e44]:
        - article [ref=e45]:
          - heading "契约优先" [level=3] [ref=e50]
          - paragraph [ref=e51]: 优化前先确定公开 API、输入输出、错误语义和边界行为，避免“变快了但语义坏了”。
        - article [ref=e52]:
          - heading "三类证据" [level=3] [ref=e56]
          - paragraph [ref=e57]: Correctness、Contract、Benchmark 分别验证行为、接口和性能，结果持续落盘可审计。
        - article [ref=e58]:
          - heading "隔离候选" [level=3] [ref=e63]
          - paragraph [ref=e64]: CLI 在 Git Worktree 中试错，VS Code 扩展使用影子工作区，原项目不会被直接修改。
        - article [ref=e65]:
          - heading "人工可控" [level=3] [ref=e71]
          - paragraph [ref=e72]: Diff、Review、Apply 分离。先看证据和差异，再决定是否应用，应用后仍可回滚。
        - article [ref=e73]:
          - heading "全程可审计" [level=3] [ref=e78]
          - paragraph [ref=e79]: 模型调用、工具调用、阶段结果、候选快照和优化记录都会保存，便于复盘与重试。
        - article [ref=e80]:
          - heading "多 Provider" [level=3] [ref=e84]
          - paragraph [ref=e85]: 支持 OpenAI、DeepSeek、OpenRouter、Kimi、GLM、Claude、豆包、通义千问等 OpenAI-compatible 服务。
