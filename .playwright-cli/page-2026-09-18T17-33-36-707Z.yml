        - generic [ref=f1e146]: What it does
        - heading "不是黑盒改代码，而是可验证地推进" [level=2] [ref=f1e148]
        - paragraph [ref=f1e149]: 把可运行项目交给 Algocode，它会在有门控的阶段中完成分析、基线、候选生成、验证、基准测试与决策。
      - generic [ref=f1e150]:
        - generic [ref=f1e151]:
          - generic [ref=f1e152]: "01"
          - heading "行为契约优先" [level=3] [ref=f1e158]
          - paragraph [ref=f1e159]: 优化前先锁定公开 API、输入输出、配置字段、错误语义与边界行为，性能不能以破坏语义为代价。
        - generic [ref=f1e160]:
          - generic [ref=f1e161]: "02"
          - heading "隔离候选生成" [level=3] [ref=f1e167]
          - paragraph [ref=f1e168]: CLI 在 Git Worktree 中试错，VS Code 在临时影子工作区中运行，原项目不会被直接修改。
        - generic [ref=f1e169]:
          - generic [ref=f1e170]: "03"
          - heading "证据驱动决策" [level=3] [ref=f1e175]
          - paragraph [ref=f1e176]: Correctness、Contract、Benchmark 三类结果全部持久化，接受或拒绝基于真实证据，而非模型自述。
        - generic [ref=f1e177]:
          - generic [ref=f1e178]: "04"
          - heading "可回滚交付" [level=3] [ref=f1e183]
          - paragraph [ref=f1e184]: Review、Accept、Apply 逐步分离。应用前看 Diff 与报告，应用后仍可通过 Manifest 回滚。
